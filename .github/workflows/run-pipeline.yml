name: run-pipeline
on:
  schedule:
    - cron: "0 */2 * * *" # every 2 hours
  workflow_dispatch: {}
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call pipeline
        run: |
          curl -sS --fail -X POST "${{ secrets.APP_URL }}/api/run" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
