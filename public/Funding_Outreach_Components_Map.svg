<rect x="1256" y="550" width="176" height="86" rx="14" fill="#DCF4E2" stroke="#2FA34F" stroke-width="2"/><text x="1344.0" y="566.0" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#111827">Fit gate: score above</text><text x="1344.0" y="584.0" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#111827">threshold moves on,</text><text x="1344.0" y="602.0" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#111827">the rest go to the</text><text x="1344.0" y="620.0" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#111827">rejected log</text>
<rect x="1048" y="668" width="176" height="86" rx="14" fill="#FCDCEA" stroke="#E0368A" stroke-width="2"/><text x="1136.0" y="684.0" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#111827">Gemini Flash extracts</text><text x="1136.0" y="702.0" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#111827">fields, keeps seed and</text><text x="1136.0" y="720.0" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#111827">pre-seed, scores fit,</text><text x="1136.0" y="738.0" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#111827">drafts the email</text>
