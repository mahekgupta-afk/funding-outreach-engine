<rect x="216" y="432" width="176" height="86" rx="14" fill="#E2E1FB" stroke="#5B57D6" stroke-width="2"/><text x="304.0" y="457.0" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#111827">GitHub Actions cron</text><text x="304.0" y="475.0" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#111827">every 2 hours calls</text><text x="304.0" y="493.0" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#111827">the /api/run endpoint</text>
<rect x="424" y="550" width="176" height="86" rx="14" fill="#DCEBFD" stroke="#3B7DD8" stroke-width="2"/><text x="512.0" y="575.0" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#111827">Fetches 5+ news feeds</text><text x="512.0" y="593.0" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#111827">(RSS, HN API), keeps</text><text x="512.0" y="611.0" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#111827">only the last 24 hrs</text>
